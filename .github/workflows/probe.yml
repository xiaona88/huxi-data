name: probe
on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe.py','.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add data/probe.json; git commit -m "probe result" || true; git push
