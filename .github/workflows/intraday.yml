name: intraday
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/intraday.py
      - run: |
          git config user.name "intraday-bot"; git config user.email "intraday@users.noreply.github.com"
          git add data/intraday; git commit -m "intraday $(TZ=Asia/Shanghai date +%F_%H:%M)" || true; git pull --rebase -q || true; git push
