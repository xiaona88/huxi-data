name: scan
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/cpo_scan.py
      - run: |
          git config user.name "scan-bot"; git config user.email "scan@users.noreply.github.com"
          git add data/scan; git commit -m "scan $(TZ=Asia/Shanghai date +%F_%H:%M)" || true; git pull --rebase -q || true; git push
