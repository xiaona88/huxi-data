name: premarket
on:
  workflow_dispatch:
    inputs:
      today:
        description: '测试用：指定日期'
        required: false
  schedule:
    - cron: '3,18,33,48 0 * * 1-5'   # 北京 08:03~08:48 每15分钟一次，GitHub 定时常延迟，多跑几次；已冻结则跳过
    - cron: '3,18 1 * * 1-5'   # 09:03、09:18 兜底
permissions:
  contents: write
jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/premarket.py
        env:
          TODAY: ${{ inputs.today }}
      - run: |
          git config user.name "premarket-bot"; git config user.email "premarket@users.noreply.github.com"
          git add data/premarket; git commit -m "premarket freeze $(TZ=Asia/Shanghai date +%F_%H:%M)" || true; git pull --rebase -q || true; git push
