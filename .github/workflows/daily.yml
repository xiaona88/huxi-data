name: daily
on:
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * 1-5'   # 北京时间 15:47
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/daily.py
      - run: |
          git config user.name "daily-bot"; git config user.email "daily@users.noreply.github.com"
          git add data; git commit -m "daily $(date -u +%F)" || true; git pull --rebase -q || true; git push
